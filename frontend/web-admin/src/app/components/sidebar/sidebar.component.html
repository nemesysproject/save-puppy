<aside class="sidebar">
    <nav class="nav">
        <div class="nav-section">
            <h3 class="nav-title">GESTIÓN</h3>
            <ul class="nav-menu">
                <li *ngFor="let item of navItems()">
                    <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                        class="nav-link">
                        <span class="nav-icon">{{ item.icon }}</span>
                        <span class="nav-label">{{ item.label }}</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-section secondary">
            <h3 class="nav-title">OTROS</h3>
            <ul class="nav-menu">
                <li>
                    <a routerLink="/settings" routerLinkActive="active" class="nav-link">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-label">Configuración</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/help" routerLinkActive="active" class="nav-link">
                        <span class="nav-icon">❓</span>
                        <span class="nav-label">Ayuda</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</aside>
