<div class="container mt-3">
  <h3>Crear Refugio</h3>

  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" formControlName="name" />
      <div *ngIf="form.controls.name.touched && form.controls.name.invalid" class="text-danger small">Nombre requerido.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" formControlName="email" />
      <div *ngIf="form.controls.email.touched && form.controls.email.invalid" class="text-danger small">Email inválido.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Dirección</label>
      <input class="form-control" formControlName="address" />
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Latitud</label>
        <input type="number" class="form-control" formControlName="latitude" />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Longitud</label>
        <input type="number" class="form-control" formControlName="longitude" />
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Capacidad</label>
        <input type="number" class="form-control" formControlName="capacity" />
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creando...' : 'Crear' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
