<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Nombre</th>
        <th>Especie</th>
        <th>Estado</th>
        <th>Refugio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pets; trackBy: trackById">
        <td>{{ p.name }}</td>
        <td>{{ p.kindId || '-' }}</td>
        <td>{{ p.status || '-' }}</td>
        <td>{{ p.shelterId || '-' }}</td>
        <td>
          <div class="btn-group" role="group">
            <a [routerLink]="['/pets', p.id]" class="btn btn-sm btn-outline-primary">Ver</a>
            <a [routerLink]="['/pets/edit', p.id]" class="btn btn-sm btn-outline-secondary">Editar</a>
            <button class="btn btn-sm btn-outline-danger" (click)="confirmDelete(p.id)">Eliminar</button>
          </div>

          <app-confirm-modal #confirmModal title="Eliminar Mascota"
            message="¿Estás seguro de que deseas eliminar esta mascota?" subMessage="Esta acción no se puede deshacer."
            confirmText="Eliminar" type="danger" (onConfirm)="onDeleteConfirmed()">
          </app-confirm-modal>
        </td>
      </tr>
    </tbody>
  </table>
</div>
