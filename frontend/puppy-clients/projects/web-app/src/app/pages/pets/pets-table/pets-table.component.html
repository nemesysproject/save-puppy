<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Nombre</th>
        <th>Especie</th>
        <th>Estado</th>
        <th>Refugio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pets; trackBy: trackById">
        <td>{{ p.name }}</td>
        <td>{{ p.kindId || '-' }}</td>
        <td>{{ p.status || '-' }}</td>
        <td>{{ p.shelterId || '-' }}</td>
        <td>
          <div class="btn-group" role="group">
            <a [routerLink]="['/pets', p.id]" class="btn btn-sm btn-outline-primary">Ver</a>
            <a [routerLink]="['/pets', p.id, 'edit']" class="btn btn-sm btn-outline-secondary">Editar</a>
            <button class="btn btn-sm btn-outline-danger">Eliminar</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
