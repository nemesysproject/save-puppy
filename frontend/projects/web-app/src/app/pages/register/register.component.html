<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <h1>Save Puppy</h1>
      <p>Crea tu cuenta para empezar</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          class="form-input"
          [class.is-invalid]="email?.invalid && (email?.dirty || email?.touched)"
        />
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="error-message">
          <span *ngIf="email?.errors?.['required']">El email es requerido</span>
          <span *ngIf="email?.errors?.['email']">Email inválido</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            class="form-input"
            [class.is-invalid]="
              password?.invalid && (password?.dirty || password?.touched)
            "
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showPassword() ? '👁️' : '👁️‍G' }}
          </button>
        </div>
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="error-message">
          <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
          <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <div class="password-input-wrapper">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Repite tu contraseña"
            class="form-input"
            [class.is-invalid]="
              (confirmPassword?.invalid || registerForm.errors?.['mismatch']) && (confirmPassword?.dirty || confirmPassword?.touched)
            "
          />
          <button
            type="button"
            class="toggle-password"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="showConfirmPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showConfirmPassword() ? '👁️' : '👁️‍G' }}
          </button>
        </div>
        <div *ngIf="(confirmPassword?.invalid || registerForm.errors?.['mismatch']) && (confirmPassword?.dirty || confirmPassword?.touched)" class="error-message">
          <span *ngIf="confirmPassword?.errors?.['required']">Debes confirmar tu contraseña</span>
          <span *ngIf="registerForm.errors?.['mismatch']">Las contraseñas no coinciden</span>
        </div>
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="registerForm.invalid || isLoading()"
      >
        <span *ngIf="!isLoading()">Registrarse</span>
        <span *ngIf="isLoading()" class="spinner">Cargando...</span>
      </button>
    </form>

    <div *ngIf="errorMessage()" class="error-alert">
      {{ errorMessage() }}
    </div>

    <div *ngIf="successMessage()" class="success-alert">
      {{ successMessage() }}
    </div>

    <div class="login-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
