<ion-app>
  @if (showTabs()) {
  <!-- Glass Side Menu -->
  <ion-menu contentId="main-content" class="glass-menu">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="none" class="glass-list">
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/dashboard" routerLinkActive="active-item" [routerLinkActiveOptions]="{exact: true}">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Inicio</ion-label>
          </ion-item>
          <ion-item routerLink="/pets" routerLinkActive="active-item">
            <ion-icon slot="start" name="paw-outline"></ion-icon>
            <ion-label>Mascotas</ion-label>
          </ion-item>
          <ion-item routerLink="/shelters" routerLinkActive="active-item">
            <ion-icon slot="start" name="business-outline"></ion-icon>
            <ion-label>Refugios</ion-label>
          </ion-item>
          <ion-item routerLink="/profile" routerLinkActive="active-item">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-label>Perfil</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  }

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
