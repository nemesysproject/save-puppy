<ion-header>
    <ion-toolbar class="glass-toolbar">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/dashboard"></ion-back-button>
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Mi Perfil</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="glass-page-gradient profile-page">
    <div class="profile-container">
        <!-- Avatar Section -->
        <div class="avatar-section">
            <div class="avatar-glow"></div>
            <div class="avatar-circle">
                <ion-icon name="person-circle-outline"></ion-icon>
            </div>
            <div class="user-meta">
                @if (user()) {
                <h2>{{ user()!.email }}</h2>
                <ion-badge class="role-badge">{{ getRoleLabel(user()!.role) }}</ion-badge>
                }
            </div>
        </div>

        <!-- Centered Information Panel -->
        <ion-card class="glass-card centered-panel">
            <ion-card-content>
                <div class="info-group">
                    <h3 class="group-title">Información de la cuenta</h3>
                    <ion-list lines="none" class="info-list">
                        @if (user()) {
                        <ion-item class="info-item">
                            <div class="item-content">
                                <span class="label">Correo electrónico</span>
                                <span class="value">{{ user()!.email }}</span>
                            </div>
                        </ion-item>
                        <ion-item class="info-item">
                            <div class="item-content">
                                <span class="label">Proveedor</span>
                                <span class="value">{{ user()!.provider }}</span>
                            </div>
                        </ion-item>
                        }
                    </ion-list>
                </div>

                <div class="divider"></div>

                <div class="info-group">
                    <h3 class="group-title">Acerca de la app</h3>
                    <ion-list lines="none" class="info-list">
                        <ion-item class="info-item">
                            <div class="item-content">
                                <span class="label">Nombre</span>
                                <span class="value">🐕 Save Puppy App</span>
                            </div>
                        </ion-item>
                        <ion-item class="info-item">
                            <div class="item-content">
                                <span class="label">Versión</span>
                                <span class="value">1.0.0</span>
                            </div>
                        </ion-item>
                    </ion-list>
                </div>
            </ion-card-content>
        </ion-card>

        <!-- Logout Button -->
        <div class="footer-actions">
            <button type="button" class="glass-btn outline-btn logout-btn" (click)="logout()">
                <ion-icon name="log-out-outline" class="btn-icon"></ion-icon>
                <span>Cerrar sesión</span>
            </button>
        </div>
    </div>
</ion-content>
