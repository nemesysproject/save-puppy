<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/pets"></ion-back-button>
        </ion-buttons>
        <ion-title>Registrar Mascota</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <div class="create-pet-container">
        <!-- Visual Section (Top/Left) -->
        <div class="visual-panel">
            <div class="glass-card capture-card">
                <div class="card-header">
                    <h2>Evidencia Visual</h2>
                    <p>Captura fotos o videos del suceso</p>
                </div>

                <div class="carousel-container">
                    <div class="media-scroller">
                        <div class="add-media-box" (click)="captureMedia()">
                            <ion-icon name="camera-outline"></ion-icon>
                            <span>Capturar</span>
                        </div>

                        @for (item of mediaItems(); track $index) {
                        <div class="media-item">
                            <img *ngIf="item.type === 'image'" [src]="item.preview" />
                            <video *ngIf="item.type === 'video'" [src]="item.preview"></video>
                            <ion-button (click)="removeMedia($index)" fill="clear" color="danger" class="remove-btn">
                                <ion-icon name="close-circle" slot="icon-only"></ion-icon>
                            </ion-button>
                        </div>
                        }
                    </div>
                </div>

                <div class="location-chip-wrapper" *ngIf="location()">
                    <ion-chip class="glass-chip">
                        <ion-icon name="location-outline"></ion-icon>
                        <ion-label>{{ locationText() }}</ion-label>
                    </ion-chip>
                </div>
            </div>
        </div>

        <!-- Form Section (Bottom/Right) -->
        <div class="form-panel">
            <div class="glass-card form-card">
                <div class="card-header">
                    <h2>Datos de la Mascota</h2>
                    <p>Completa la información necesaria</p>
                </div>

                <div class="form-content">
                    <div class="input-section">
                        <ion-label class="section-label">Nombre de la Mascota</ion-label>
                        <div class="glass-input-wrapper">
                            <ion-icon name="paw-outline" class="input-icon"></ion-icon>
                            <input [(ngModel)]="petForm.name" type="text" placeholder="Ej. Bobby" class="glass-input" />
                        </div>
                    </div>

                    <!-- ESTADO -->
                    <div class="field-box full">
                        <label>¿Cuál es su estado actual?</label>
                        <div class="status-selector">
                            <button type="button" [class.active]="petForm.status === 'LOST'"
                                (click)="petForm.status = 'LOST'">Perdido</button>
                            <button type="button" [class.active]="petForm.status === 'ADOPTION'"
                                (click)="petForm.status = 'ADOPTION'">Adopción</button>
                            <button type="button" [class.active]="petForm.status === 'FOUND'"
                                (click)="petForm.status = 'FOUND'">Hallado</button>
                        </div>
                    </div>

                    <!-- CATEGORÍA Y GÉNERO -->
                    <div class="form-row">
                        <div class="field-box">
                            <label>Categoría</label>
                            <div class="custom-select-group">
                                <select [(ngModel)]="petForm.kindId" (change)="onKindChange($event)">
                                    <option value="" disabled selected>Tipo...</option>
                                    <option *ngFor="let kind of kinds()" [value]="kind.id">{{ kind.name }}</option>
                                </select>
                            </div>
                        </div>

                        <div class="field-box">
                            <label>Género</label>
                            <div class="custom-select-group">
                                <select [(ngModel)]="petForm.genderId">
                                    <option value="" disabled selected>Sexo...</option>
                                    <option *ngFor="let gender of genders()" [value]="gender.id">{{ gender.name }}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- RAZA -->
                    <div class="field-box full" *ngIf="races().length > 0">
                        <label>Raza específica</label>
                        <div class="custom-select-group">
                            <select [(ngModel)]="petForm.raceId">
                                <option value="" selected>Opcional (Desconocida)</option>
                                <option *ngFor="let race of races()" [value]="race.id">{{ race.name }}</option>
                            </select>
                        </div>
                    </div>
                </div>

                <footer class="form-actions">
                    <button class="btn-submit" (click)="savePet()" [disabled]="isSaving() || mediaItems().length === 0">
                        <ion-spinner *ngIf="isSaving()" name="dots"></ion-spinner>
                        <span *ngIf="!isSaving()">Publicar</span>
                    </button>
                    <button class="btn-cancel" (click)="cancel()">Cancelar</button>
                </footer>
            </div>
        </div>
    </div>
</ion-content>
