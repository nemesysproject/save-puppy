<ion-content [fullscreen]="true" class="glass-page login-page">
  <div class="page-container">
    <div class="logo-section">
      <ion-icon name="paw" class="logo-icon"></ion-icon>
      <h1>save puppy</h1>
      <p>Conecta, adopta y rescata</p>
    </div>

    <ion-card class="glass-card login-card">
      <ion-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Email Input -->
          <div class="glass-input-wrapper" [class.has-error]="email?.invalid && (email?.dirty || email?.touched)">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input formControlName="email" type="email" placeholder="Correo electrónico" class="glass-input" />
          </div>

          <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="error-msg">
            <span *ngIf="email?.errors?.['required']">El email es requerido</span>
            <span *ngIf="email?.errors?.['email']">Email inválido</span>
          </div>

          <!-- Password Input -->
          <div class="glass-input-wrapper"
            [class.has-error]="password?.invalid && (password?.dirty || password?.touched)">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input formControlName="password" [type]="showPassword() ? 'text' : 'password'" placeholder="Contraseña"
              class="glass-input" />
            <button type="button" class="icon-btn" (click)="togglePasswordVisibility()">
              <ion-icon [name]="showPassword() ? 'eye' : 'eye-off'"></ion-icon>
            </button>
          </div>

          <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="error-msg">
            <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
            <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
          </div>

          <!-- Error Alert -->
          <div *ngIf="errorMessage()" class="error-alert">
            <p>{{ errorMessage() }}</p>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="glass-btn primary-btn" [disabled]="loginForm.invalid || isLoading()">
            <span *ngIf="!isLoading()">Entrar</span>
            <ion-spinner *ngIf="isLoading()" name="dots" class="btn-spinner"></ion-spinner>
          </button>
        </form>

        <div class="divider">o continúa con</div>

        <!-- Biometric Button -->
        <button type="button" class="glass-btn outline-btn" (click)="loginWithBiometrics()" [disabled]="isLoading()">
          <ion-icon name="finger-print-outline" class="btn-icon"></ion-icon>
          <span>Usar biometría</span>
        </button>

        <!-- Footer Links -->
        <div class="page-footer">
          <p class="footer-text">
            ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
          </p>
          <p class="footer-text">
            <a href="#">Recuperar contraseña</a>
          </p>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
